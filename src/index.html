

<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학생 출석 관리 시스템</title>

    <style>
        :root {
          --blue: #1769e0;
          --blue-dark: #0d47a1;
          --background: #f4f7fb;
          --white: #ffffff;
          --text: #172033;
          --muted: #6b7280;
          --border: #e1e7ef;
          --green: #159957;
          --orange: #e58a00;
          --red: #d9363e;
          --purple: #7651d6;
        }

        * {
          box-sizing: border-box;
        }

        body {
          margin: 0;
          background: var(--background);
          color: var(--text);
          font-family: Arial, "Noto Sans KR", sans-serif;
        }

        header {
          background: linear-gradient(135deg, var(--blue-dark), var(--blue));
          color: white;
          padding: 22px;
          box-shadow: 0 3px 15px rgba(0,0,0,.15);
        }

        .header-inner {
          max-width: 1600px;
          margin: auto;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 20px;
        }

        h1 {
          margin: 0;
          font-size: 26px;
        }

        .subtitle {
          margin-top: 7px;
          font-size: 14px;
          opacity: .9;
        }

        .container {
          max-width: 1600px;
          margin: 22px auto;
          padding: 0 20px;
        }

        button,
        input,
        select {
          font: inherit;
        }

        button {
          border: none;
          border-radius: 8px;
          padding: 10px 14px;
          cursor: pointer;
          font-weight: bold;
        }

        button:hover {
          opacity: .88;
        }

        .btn-white {
          background: white;
          color: var(--blue-dark);
        }

        .btn-primary {
          background: var(--blue);
          color: white;
        }

        .btn-secondary {
          background: #edf2fa;
          color: #26354d;
        }

        .btn-danger {
          background: #ffeded;
          color: var(--red);
        }

        .btn-success {
          background: var(--green);
          color: white;
        }

        .stats {
          display: grid;
          grid-template-columns: repeat(5, 1fr);
          gap: 14px;
          margin-bottom: 18px;
        }

        .stat-card {
          background: white;
          border: 1px solid var(--border);
          border-radius: 14px;
          padding: 18px;
          box-shadow: 0 3px 14px rgba(23,32,51,.05);
        }

        .stat-label {
          color: var(--muted);
          font-size: 13px;
        }

        .stat-number {
          margin-top: 8px;
          font-size: 28px;
          font-weight: bold;
        }

        .green {
          color: var(--green);
        }

        .orange {
          color: var(--orange);
        }

        .red {
          color: var(--red);
        }

        .purple {
          color: var(--purple);
        }

        .toolbar {
          background: white;
          border: 1px solid var(--border);
          border-radius: 14px;
          padding: 15px;
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: 10px;
          margin-bottom: 16px;
        }

        input,
        select {
          background: white;
          border: 1px solid #d5dce7;
          border-radius: 8px;
          padding: 10px 12px;
          outline: none;
        }

        input:focus,
        select:focus {
          border-color: var(--blue);
        }

        .date-box {
          display: flex;
          align-items: center;
          gap: 8px;
          background: #f0f5ff;
          padding: 6px;
          border-radius: 10px;
        }

        .date-box input {
          min-width: 150px;
        }

        .table-wrapper {
          background: white;
          border: 1px solid var(--border);
          border-radius: 14px;
          overflow: auto;
          box-shadow: 0 3px 14px rgba(23,32,51,.05);
        }

        table {
          width: 100%;
          min-width: 1100px;
          border-collapse: collapse;
        }

        th,
        td {
          border-bottom: 1px solid var(--border);
          padding: 11px 10px;
          text-align: center;
          white-space: nowrap;
        }

        th {
          background: #f8fafc;
          font-size: 13px;
          position: sticky;
          top: 0;
          z-index: 2;
        }

        td.student-name {
          text-align: left;
          font-weight: bold;
        }

        .student-code {
          color: var(--muted);
          font-size: 12px;
          margin-top: 4px;
        }

        .status-select {
          min-width: 105px;
          font-weight: bold;
          padding: 7px;
        }

        .status-select.present {
          background: #e8f8ee;
          color: #11763e;
        }

        .status-select.late {
          background: #fff3d9;
          color: #995b00;
        }

        .status-select.absent {
          background: #ffe8eb;
          color: #b4232c;
        }

        .status-select.unexcused {
          background: #eee9ff;
          color: #6541b8;
        }

        .rate-bar {
          width: 90px;
          height: 7px;
          background: #edf0f5;
          border-radius: 10px;
          overflow: hidden;
          margin: 7px auto 0;
        }

        .rate-fill {
          height: 100%;
          background: var(--green);
        }

        .action-buttons {
          display: flex;
          justify-content: center;
          gap: 6px;
        }

        .small-button {
          padding: 7px 9px;
          font-size: 12px;
        }

        .empty {
          padding: 45px;
          color: var(--muted);
          text-align: center;
        }

        .legend {
          display: flex;
          flex-wrap: wrap;
          gap: 12px;
          color: var(--muted);
          font-size: 12px;
        }

        .legend-item {
          display: flex;
          align-items: center;
          gap: 5px;
        }

        .legend-dot {
          width: 10px;
          height: 10px;
          border-radius: 50%;
        }

        .modal {
          display: none;
          position: fixed;
          inset: 0;
          background: rgba(0,0,0,.65);
          z-index: 50;
          align-items: center;
          justify-content: center;
          padding: 15px;
        }

        .modal.show {
          display: flex;
        }

        .modal-content {
          width: min(500px, 100%);
          background: white;
          border-radius: 15px;
          padding: 24px;
        }

        .modal-content h2 {
          margin-top: 0;
        }

        .form-group {
          margin-bottom: 15px;
        }

        .form-group label {
          display: block;
          font-weight: bold;
          font-size: 13px;
          margin-bottom: 6px;
        }

        .form-group input {
          width: 100%;
        }

        .modal-actions {
          display: flex;
          justify-content: flex-end;
          gap: 8px;
          margin-top: 20px;
        }

        .toast {
          display: none;
          position: fixed;
          right: 20px;
          bottom: 20px;
          background: #172033;
          color: white;
          padding: 13px 18px;
          border-radius: 10px;
          z-index: 100;
        }

        .toast.show {
          display: block;
        }

        @media (max-width: 1000px) {
          .stats {
            grid-template-columns: repeat(3, 1fr);
          }

          .header-inner {
            flex-direction: column;
            align-items: flex-start;
          }
        }

        @media (max-width: 600px) {
          .stats {
            grid-template-columns: repeat(2, 1fr);
          }

          .container {
            padding: 0 10px;
          }

          h1 {
            font-size: 21px;
          }
        }
    </style>
</head>

<body>

<header>
    <div class="header-inner">
        <div>
            <h1>🎓 학생 출석 관리 시스템</h1>
            <div class="subtitle">
                금융기관론 001분반 · 학생 출석 관리
            </div>
        </div>

        <div>
            <button class="btn-white" onclick="openStudentModal()">
                ＋ 학생 추가
            </button>
        </div>
    </div>
</header>

<main class="container">

    <!-- 통계 -->
    <section class="stats">
        <div class="stat-card">
            <div class="stat-label">전체 학생</div>
            <div class="stat-number" id="totalStudents">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">출석</div>
            <div class="stat-number green" id="presentCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">지각</div>
            <div class="stat-number orange" id="lateCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">결석</div>
            <div class="stat-number red" id="absentCount">0</div>
        </div>

        <div class="stat-card">
            <div class="stat-label">무단결석</div>
            <div class="stat-number purple" id="unexcusedCount">0</div>
        </div>
    </section>

    <!-- Công cụ -->
    <section class="toolbar">

        <input
                id="searchInput"
                type="text"
                placeholder="학생 이름 또는 학번 검색"
                oninput="renderTable()"
        >

        <select id="statusFilter" onchange="renderTable()">
            <option value="">전체 상태</option>
            <option value="present">출석</option>
            <option value="late">지각</option>
            <option value="absent">결석</option>
            <option value="unexcused">무단결석</option>
        </select>

        <select id="dateFilter" onchange="renderTable()">
            <option value="">전체 날짜</option>
        </select>

        <!-- Thêm ngày điểm danh -->
        <div class="date-box">
            <label for="newDate">📅</label>

            <input
                    type="date"
                    id="newDate"
            >

            <button class="btn-primary" onclick="addAttendanceDate()">
                날짜 추가
            </button>
        </div>

        <button class="btn-secondary" onclick="resetFilters()">
            필터 초기화
        </button>

        <button class="btn-primary" onclick="exportCSV()">
            📥 CSV 다운로드
        </button>

        <button class="btn-primary" onclick="exportExcel()">
            📊 Excel 다운로드
        </button>

        <button class="btn-danger" onclick="clearAllData()">
            전체 데이터 초기화
        </button>

        <div class="legend">
      <span class="legend-item">
        <span class="legend-dot" style="background:#159957"></span>
        출석
      </span>

            <span class="legend-item">
        <span class="legend-dot" style="background:#e58a00"></span>
        지각
      </span>

            <span class="legend-item">
        <span class="legend-dot" style="background:#d9363e"></span>
        결석
      </span>

            <span class="legend-item">
        <span class="legend-dot" style="background:#7651d6"></span>
        무단결석
      </span>
        </div>
    </section>

    <!-- Bảng điểm danh -->
    <section class="table-wrapper">
        <table>
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
        </table>
    </section>

</main>

<!-- Modal thêm/sửa sinh viên -->
<div class="modal" id="studentModal">
    <div class="modal-content">

        <h2 id="modalTitle">학생 추가</h2>

        <div class="form-group">
            <label for="studentName">학생 이름</label>
            <input
                    id="studentName"
                    type="text"
                    placeholder="학생 이름 입력"
            >
        </div>

        <div class="form-group">
            <label for="studentCode">학번</label>
            <input
                    id="studentCode"
                    type="text"
                    placeholder="학번 입력"
            >
        </div>

        <div class="modal-actions">
            <button class="btn-secondary" onclick="closeStudentModal()">
                취소
            </button>

            <button class="btn-primary" onclick="saveStudent()">
                저장
            </button>
        </div>

    </div>
</div>

<div class="toast" id="toast"></div>

<script>
    /* ============================
       DANH SÁCH SINH VIÊN MẶC ĐỊNH
    ============================ */

    const DEFAULT_STUDENTS = [
      {
        id: "student-1",
        name: "고피르조노바 무니사보누 압두하킴 키지",
        code: "2026612108"
      },
      {
        id: "student-2",
        name: "라 티 쑤언",
        code: "2026612101"
      },
      {
        id: "student-3",
        name: "레 반 당",
        code: "2026612102"
      },
      {
        id: "student-4",
        name: "마마카디르 키지 아팔",
        code: "2025612101"
      },
      {
        id: "student-5",
        name: "민 카인 스완",
        code: "2026612103"
      },
      {
        id: "student-6",
        name: "브엉 타인 땀",
        code: "2026612109"
      },
      {
        id: "student-7",
        name: "에인 흐무 코",
        code: "2026612105"
      },
      {
        id: "student-8",
        name: "응우옌 티 후엔",
        code: "2026612110"
      },
      {
        id: "student-9",
        name: "호앙 티 프엉",
        code: "2026612106"
      },
      {
        id: "student-10",
        name: "후인 콩 강",
        code: "2026612107"
      }
    ];

    /* ============================
       DỮ LIỆU LƯU TRONG TRÌNH DUYỆT
    ============================ */

    const STUDENTS_KEY = "student_attendance_students_v4";
    const DATES_KEY = "student_attendance_dates_v4";
    const RECORDS_KEY = "student_attendance_records_v4";

    let students = JSON.parse(
      localStorage.getItem(STUDENTS_KEY) || "null"
    );

    let attendanceDates = JSON.parse(
      localStorage.getItem(DATES_KEY) || "null"
    );

    let attendanceRecords = JSON.parse(
      localStorage.getItem(RECORDS_KEY) || "{}"
    );

    let editingStudentId = null;

    /* Nếu chưa có dữ liệu thì sử dụng danh sách mặc định */
    if (!students) {
      students = DEFAULT_STUDENTS;
    }

    if (!attendanceDates) {
      attendanceDates = [];
    }

    saveData();

    /* ============================
       HÀM CƠ BẢN
    ============================ */

    function saveData() {
      localStorage.setItem(
        STUDENTS_KEY,
        JSON.stringify(students)
      );

      localStorage.setItem(
        DATES_KEY,
        JSON.stringify(attendanceDates)
      );

      localStorage.setItem(
        RECORDS_KEY,
        JSON.stringify(attendanceRecords)
      );
    }

    function getToday() {
      const date = new Date();
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");

      return `${year}-${month}-${day}`;
    }

    function formatDate(dateString) {
      const date = new Date(dateString + "T00:00:00");

      return date.toLocaleDateString("ko-KR", {
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      });
    }

    function recordKey(studentId, date) {
      return `${studentId}__${date}`;
    }

    function showToast(message) {
      const toast = document.getElementById("toast");

      toast.textContent = message;
      toast.classList.add("show");

      setTimeout(() => {
        toast.classList.remove("show");
      }, 2200);
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, function(char) {
        const map = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return map[char];
      });
    }

    /* ============================
       THÊM NGÀY ĐIỂM DANH
    ============================ */

    function addAttendanceDate() {
      const dateInput = document.getElementById("newDate");
      const selectedDate = dateInput.value;

      if (!selectedDate) {
        alert("추가할 날짜를 선택하세요.");
        return;
      }

      if (attendanceDates.includes(selectedDate)) {
        alert("이미 추가된 날짜입니다.");
        return;
      }

      attendanceDates.push(selectedDate);
      attendanceDates.sort();

      saveData();
      renderTable();

      dateInput.value = "";

      showToast(
        `${formatDate(selectedDate)} 날짜가 추가되었습니다.`
      );
    }

    /* ============================
       XÓA NGÀY ĐIỂM DANH
    ============================ */

    function deleteAttendanceDate(date) {
      const answer = confirm(
        `${formatDate(date)} 날짜를 삭제하시겠습니까?\n해당 날짜의 출석 기록도 삭제됩니다.`
      );

      if (!answer) {
        return;
      }

      attendanceDates = attendanceDates.filter(
        item => item !== date
      );

      Object.keys(attendanceRecords).forEach(key => {
        if (key.endsWith("__" + date)) {
          delete attendanceRecords[key];
        }
      });

      saveData();
      renderTable();

      showToast("날짜가 삭제되었습니다.");
    }

    /* ============================
       CẬP NHẬT TRẠNG THÁI
    ============================ */

    function updateStatus(studentId, date, status) {
      const key = recordKey(studentId, date);

      if (status === "") {
        delete attendanceRecords[key];
      } else {
        attendanceRecords[key] = status;
      }

      saveData();
      renderTable();
    }

    function getStatusText(status) {
      const labels = {
        present: "출석",
        late: "지각",
        absent: "결석",
        unexcused: "무단결석"
      };

      return labels[status] || "미입력";
    }

    /* ============================
       HIỂN THỊ BẢNG
    ============================ */

    function renderTable() {
      const searchText = document
        .getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

      const statusFilter = document
        .getElementById("statusFilter")
        .value;

      const dateFilter = document
        .getElementById("dateFilter")
        .value;

      const filteredStudents = students.filter(student => {
        const searchTarget = (
          student.name + " " + student.code
        ).toLowerCase();

        if (
          searchText &&
          !searchTarget.includes(searchText)
        ) {
          return false;
        }

        if (statusFilter) {
          const found = attendanceDates.some(date => {
            if (dateFilter && date !== dateFilter) {
              return false;
            }

            return (
              attendanceRecords[
                recordKey(student.id, date)
              ] === statusFilter
            );
          });

          if (!found) {
            return false;
          }
        }

        return true;
      });

      /* Cập nhật danh sách ngày trong bộ lọc */
      const dateSelect = document.getElementById("dateFilter");
      const oldDateFilter = dateFilter;

      dateSelect.innerHTML =
        '<option value="">전체 날짜</option>' +
        attendanceDates.map(date => {
          const selected =
            date === oldDateFilter ? "selected" : "";

          return `
            <option value="${date}" ${selected}>
              ${formatDate(date)}
            </option>
          `;
        }).join("");

      /* Tạo tiêu đề bảng */
      const tableHead = document.getElementById("tableHead");

      tableHead.innerHTML = `
        <tr>
          <th>No.</th>
          <th>학생 이름 / 학번</th>

          ${attendanceDates.map(date => `
            <th>
              ${formatDate(date)}
              <br>
              <button
                class="btn-danger small-button"
                onclick="deleteAttendanceDate('${date}')"
              >
                날짜 삭제
              </button>
            </th>
          `).join("")}

          <th>출석률</th>
          <th>관리</th>
        </tr>
      `;

      /* Tạo nội dung bảng */
      const tableBody = document.getElementById("tableBody");

      if (filteredStudents.length === 0) {
        tableBody.innerHTML = `
          <tr>
            <td
              colspan="${attendanceDates.length + 4}"
              class="empty"
            >
              학생 또는 출석 날짜가 없습니다.
            </td>
          </tr>
        `;

        updateStatistics();
        return;
      }

      tableBody.innerHTML = filteredStudents.map(
        (student, index) => {
          const totalDates = attendanceDates.length;

          const presentDates = attendanceDates.filter(date => {
            return (
              attendanceRecords[
                recordKey(student.id, date)
              ] === "present"
            );
          }).length;

          const attendanceRate = totalDates > 0
            ? Math.round(
                presentDates / totalDates * 100
              )
            : 0;

          return `
            <tr>
              <td>${index + 1}</td>

              <td class="student-name">
                ${escapeHTML(student.name)}
                <div class="student-code">
                  ${escapeHTML(student.code)}
                </div>
              </td>

              ${attendanceDates.map(date => {
                const key = recordKey(student.id, date);
                const currentStatus =
                  attendanceRecords[key] || "";

                return `
                  <td>
                    <select
                      class="status-select ${currentStatus}"
                      onchange="
                        updateStatus(
                          '${student.id}',
                          '${date}',
                          this.value
                        )
                      "
                    >
                      <option value="">
                        미입력
                      </option>

                      <option
                        value="present"
                        ${currentStatus === "present" ? "selected" : ""}
                      >
                        출석
                      </option>

                      <option
                        value="late"
                        ${currentStatus === "late" ? "selected" : ""}
                      >
                        지각
                      </option>

                      <option
                        value="absent"
                        ${currentStatus === "absent" ? "selected" : ""}
                      >
                        결석
                      </option>

                      <option
                        value="unexcused"
                        ${currentStatus === "unexcused" ? "selected" : ""}
                      >
                        무단결석
                      </option>
                    </select>
                  </td>
                `;
              }).join("")}

              <td>
                <strong>${attendanceRate}%</strong>

                <div class="rate-bar">
                  <div
                    class="rate-fill"
                    style="width:${attendanceRate}%"
                  ></div>
                </div>
              </td>

              <td>
                <div class="action-buttons">
                  <button
                    class="btn-secondary small-button"
                    onclick="editStudent('${student.id}')"
                  >
                    수정
                  </button>

                  <button
                    class="btn-danger small-button"
                    onclick="deleteStudent('${student.id}')"
                  >
                    삭제
                  </button>
                </div>
              </td>
            </tr>
          `;
        }
      ).join("");

      updateStatistics();
    }

    /* ============================
       THỐNG KÊ
    ============================ */

    function updateStatistics() {
      document.getElementById("totalStudents").textContent =
        students.length;

      let present = 0;
      let late = 0;
      let absent = 0;
      let unexcused = 0;

      Object.values(attendanceRecords).forEach(status => {
        if (status === "present") present++;
        if (status === "late") late++;
        if (status === "absent") absent++;
        if (status === "unexcused") unexcused++;
      });

      document.getElementById("presentCount").textContent =
        present;

      document.getElementById("lateCount").textContent =
        late;

      document.getElementById("absentCount").textContent =
        absent;

      document.getElementById("unexcusedCount").textContent =
        unexcused;
    }

    /* ============================
       THÊM / SỬA SINH VIÊN
    ============================ */

    function openStudentModal(studentId = null) {
      editingStudentId = studentId;

      const modal = document.getElementById("studentModal");
      const title = document.getElementById("modalTitle");
      const nameInput = document.getElementById("studentName");
      const codeInput = document.getElementById("studentCode");

      if (studentId) {
        const student = students.find(
          item => item.id === studentId
        );

        title.textContent = "학생 정보 수정";
        nameInput.value = student.name;
        codeInput.value = student.code;
      } else {
        title.textContent = "학생 추가";
        nameInput.value = "";
        codeInput.value = "";
      }

      modal.classList.add("show");
    }

    function closeStudentModal() {
      document
        .getElementById("studentModal")
        .classList.remove("show");
    }

    function saveStudent() {
      const name = document
        .getElementById("studentName")
        .value
        .trim();

      const code = document
        .getElementById("studentCode")
        .value
        .trim();

      if (!name || !code) {
        alert("학생 이름과 학번을 입력하세요.");
        return;
      }

      const duplicate = students.some(student => {
        return (
          student.code === code &&
          student.id !== editingStudentId
        );
      });

      if (duplicate) {
        alert("이미 등록된 학번입니다.");
        return;
      }

      if (editingStudentId) {
        const student = students.find(
          item => item.id === editingStudentId
        );

        student.name = name;
        student.code = code;

        showToast("학생 정보가 수정되었습니다.");
      } else {
        students.push({
          id: "student-" + Date.now(),
          name: name,
          code: code
        });

        showToast("학생이 추가되었습니다.");
      }

      saveData();
      closeStudentModal();
      renderTable();
    }

    function editStudent(studentId) {
      openStudentModal(studentId);
    }

    /* ============================
       XÓA SINH VIÊN
    ============================ */

    function deleteStudent(studentId) {
      const student = students.find(
        item => item.id === studentId
      );

      if (!student) {
        return;
      }

      const answer = confirm(
        `${student.name} 학생을 삭제하시겠습니까?`
      );

      if (!answer) {
        return;
      }

      students = students.filter(
        item => item.id !== studentId
      );

      Object.keys(attendanceRecords).forEach(key => {
        if (key.startsWith(studentId + "__")) {
          delete attendanceRecords[key];
        }
      });

      saveData();
      renderTable();

      showToast("학생이 삭제되었습니다.");
    }

    /* ============================
       BỘ LỌC
    ============================ */

    function resetFilters() {
      document.getElementById("searchInput").value = "";
      document.getElementById("statusFilter").value = "";
      document.getElementById("dateFilter").value = "";

      renderTable();
    }

    /* ============================
       XUẤT CSV
    ============================ */

    function exportCSV() {
      const rows = [];

      rows.push([
        "학생 이름",
        "학번",
        ...attendanceDates.map(date => formatDate(date)),
        "출석률"
      ]);

      students.forEach(student => {
        const presentCount = attendanceDates.filter(date => {
          return (
            attendanceRecords[
              recordKey(student.id, date)
            ] === "present"
          );
        }).length;

        const rate = attendanceDates.length > 0
          ? Math.round(
              presentCount / attendanceDates.length * 100
            ) + "%"
          : "0%";

        rows.push([
          student.name,
          student.code,
          ...attendanceDates.map(date => {
            const status =
              attendanceRecords[
                recordKey(student.id, date)
              ] || "";

            return getStatusText(status);
          }),
          rate
        ]);
      });

      const csvContent =
        "\uFEFF" +
        rows.map(row => {
          return row.map(value => {
            return '"' +
              String(value).replaceAll('"', '""') +
              '"';
          }).join(",");
        }).join("\n");

      const blob = new Blob(
        [csvContent],
        { type: "text/csv;charset=utf-8;" }
      );

      downloadFile(blob, "학생_출석기록.csv");
    }

    /* ============================
       XUẤT EXCEL
    ============================ */

    function exportExcel() {
      if (!window.XLSX) {
        alert(
          "Excel 라이브러리를 불러오지 못했습니다. CSV를 사용하세요."
        );
        return;
      }

      const rows = students.map(student => {
        const row = {
          "학생 이름": student.name,
          "학번": student.code
        };

        attendanceDates.forEach(date => {
          const status =
            attendanceRecords[
              recordKey(student.id, date)
            ] || "";

          row[formatDate(date)] = getStatusText(status);
        });

        const presentCount = attendanceDates.filter(date => {
          return (
            attendanceRecords[
              recordKey(student.id, date)
            ] === "present"
          );
        }).length;

        row["출석률"] = attendanceDates.length > 0
          ? Math.round(
              presentCount / attendanceDates.length * 100
            ) + "%"
          : "0%";

        return row;
      });

      const worksheet = XLSX.utils.json_to_sheet(rows);
      const workbook = XLSX.utils.book_new();

      XLSX.utils.book_append_sheet(
        workbook,
        worksheet,
        "출석기록"
      );

      XLSX.writeFile(
        workbook,
        "학생_출석기록.xlsx"
      );
    }

    /* ============================
       TẢI FILE
    ============================ */

    function downloadFile(blob, filename) {
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");

      link.href = url;
      link.download = filename;
      link.click();

      setTimeout(() => {
        URL.revokeObjectURL(url);
      }, 500);
    }

    /* ============================
       XÓA TOÀN BỘ DỮ LIỆU
    ============================ */

    function clearAllData() {
      const answer = confirm(
        "모든 학생, 날짜 및 출석 기록을 삭제하시겠습니까?"
      );

      if (!answer) {
        return;
      }

      localStorage.removeItem(STUDENTS_KEY);
      localStorage.removeItem(DATES_KEY);
      localStorage.removeItem(RECORDS_KEY);

      location.reload();
    }

    /* ============================
       KHỞI ĐỘNG
    ============================ */

    document.getElementById("newDate").value = getToday();

    document
      .getElementById("studentModal")
      .addEventListener("click", function(event) {
        if (event.target.id === "studentModal") {
          closeStudentModal();
        }
      });

    renderTable();
</script>

      var ws = new WebSocket('ws://' + window.location.host +
                 '/jb-server-page?reloadMode=RELOAD_ON_SAVE&'+
                 'referrer=' + encodeURIComponent(window.location.pathname));
      ws.onmessage = function (msg) {
          if (msg.data === 'reload') {
              window.location.reload();
          }
          if (msg.data.startsWith('update-css ')) {
              var messageId = msg.data.substring(11);
              var links = document.getElementsByTagName('link');
              for (var i = 0; i < links.length; i++) {
                  var link = links[i];
                  if (link.rel !== 'stylesheet') continue;
                  var clonedLink = link.cloneNode(true);
                  var newHref = link.href.replace(/(&|\?)jbUpdateLinksId=\d+/, "$1jbUpdateLinksId=" + messageId);
                  if (newHref !== link.href) {
                    clonedLink.href = newHref;
                  }
                  else {
                    var indexOfQuest = newHref.indexOf('?');
                    if (indexOfQuest >= 0) {
                      // to support ?foo#hash
                      clonedLink.href = newHref.substring(0, indexOfQuest + 1) + 'jbUpdateLinksId=' + messageId + '&' +
                                        newHref.substring(indexOfQuest + 1);
                    }
                    else {
                      clonedLink.href += '?' + 'jbUpdateLinksId=' + messageId;
                    }
                  }
                  link.replaceWith(clonedLink);
              }
          }
      };
    })();
</script>
